name: App CI

# Pipeline 1 of 3: application CI.
# Every change: build, test and package the Lambda JAR.
# A version tag (v1.2.3): also publish that same JAR, once, to Artifactory.
# Nothing here touches AWS.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]          # path filters are not evaluated for tag pushes
    paths:
      - "app/**"
      - "scripts/publish-lambda-artifact.sh"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/publish-lambda-artifact.sh"
      - ".github/workflows/app-ci.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Resolve the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tags must look like v1.2.3"; exit 1; }
          else
            version="0.0.0-SNAPSHOT"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build, test and package the JAR
        working-directory: app
        run: ./gradlew build -PreleaseVersion="${{ steps.version.outputs.value }}"

      # GitHub Actions storage: handy for inspecting a run. This is NOT the release.
      - name: Keep the JAR with this run
        uses: actions/upload-artifact@v7
        with:
          name: hello-world-lambda-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: app/build/libs/hello-world-lambda.jar
          if-no-files-found: error
          retention-days: 7

      # The release: the exact bytes built and tested above, published once.
      - name: Publish the release to Artifactory
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARTIFACTORY_BASE_URL: ${{ vars.ARTIFACTORY_BASE_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_PUBLISH_TOKEN }}
        run: scripts/publish-lambda-artifact.sh
